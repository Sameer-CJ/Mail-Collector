<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SClom Lead Collector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">

    <h1>SClom Lead Collector</h1>
    <p class="subtitle">Google Maps Lead Generator</p>

    <div class="stats">
      <div class="stat">
        <span id="totalLeads">0</span>
        <small>Total Leads</small>
      </div>

      <div class="stat">
        <span id="newLeads">0</span>
        <small>New Leads</small>
      </div>
    </div>

    <button id="collectBtn" class="primary-btn">
      Collect Leads
    </button>

    <button id="exportBtn" class="secondary-btn">
      Export CSV
    </button>

    <button id="clearBtn" class="danger-btn">
      Clear All Leads
    </button>

    <div id="status" class="status">
      Open Google Maps and search for restaurants.
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
